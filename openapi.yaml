openapi: 3.0.3
info:
  description: REST API for Seymour, an RSS feed aggregator with a curated timeline.
  title: Seymour API
  version: 0.1.0
paths:
  /api/feed-entries/{feedEntryID}:
    get:
      operationId: getFeedEntry
      parameters:
      - in: path
        name: feedEntryID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FeedEntryResp'
          description: OK
      summary: Get the full, reader-mode content of a feed entry.
      tags:
      - feed-entries
  /api/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
      summary: Clear the session cookie.
      tags:
      - auth
  /api/oauth-callback/gh:
    get:
      operationId: githubOAuthCallback
      parameters:
      - description: Opaque state value echoed back from GitHub, verified against
          the oauth_state cookie.
        in: query
        name: state
        schema:
          description: Opaque state value echoed back from GitHub, verified against
            the oauth_state cookie.
          type: string
      - description: Authorization code to exchange for a GitHub access token.
        in: query
        name: code
        schema:
          description: Authorization code to exchange for a GitHub access token.
          type: string
      responses:
        "302":
          description: Found
      summary: 'GitHub OAuth callback: verifies state, ensures the user, sets the
        session cookie, and redirects to FRONTEND_URL.'
      tags:
      - auth
  /api/oauth-login/gh:
    get:
      operationId: startGithubLogin
      parameters:
      - description: Path on FRONTEND_URL to send the browser to after login. Defaults
          to /.
        in: query
        name: s
        schema:
          description: Path on FRONTEND_URL to send the browser to after login. Defaults
            to /.
          type: string
      responses:
        "302":
          description: Found
      summary: Start GitHub OAuth login; redirects the browser to GitHub.
      tags:
      - auth
  /api/subscriptions:
    get:
      operationId: listSubscriptions
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1SubscriptionListResp'
          description: Created
      summary: List the viewer's subscriptions.
      tags:
      - subscriptions
    post:
      operationId: createSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1PostSubscriptionReq'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FeedResp'
          description: Created
      summary: Subscribe to a feed by URL, triggering the CreateFeed workflow.
      tags:
      - subscriptions
  /api/subscriptions/{subscriptionID}:
    delete:
      operationId: deleteSubscription
      parameters:
      - in: path
        name: subscriptionID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Unsubscribe from a feed.
      tags:
      - subscriptions
  /api/timeline:
    get:
      operationId: getTimeline
      parameters:
      - description: Filter the timeline to a single feed.
        in: query
        name: feed_id
        schema:
          description: Filter the timeline to a single feed.
          type: string
      - description: Filter by entry status (requires_judgement, approved, rejected).
          Defaults to all statuses.
        in: query
        name: status
        schema:
          description: Filter by entry status (requires_judgement, approved, rejected).
            Defaults to all statuses.
          type: string
      - description: Only include entries published on or after this date (RFC3339
          or YYYY-MM-DD).
        in: query
        name: from
        schema:
          description: Only include entries published on or after this date (RFC3339
            or YYYY-MM-DD).
          type: string
      - description: Only include entries published on or before this date (RFC3339
          or YYYY-MM-DD).
        in: query
        name: to
        schema:
          description: Only include entries published on or before this date (RFC3339
            or YYYY-MM-DD).
          type: string
      - description: Page size, default 20, max 100.
        in: query
        name: limit
        schema:
          description: Page size, default 20, max 100.
          type: integer
      - description: Pagination offset, default 0.
        in: query
        name: offset
        schema:
          description: Pagination offset, default 0.
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1TimelineResp'
          description: OK
      summary: Get the paginated, curated timeline, optionally filtered by status
        and publish date.
      tags:
      - timeline
  /api/users/{userID}/filters:
    get:
      operationId: listFilters
      parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilterListResp'
          description: OK
      summary: List the user's filters.
      tags:
      - filters
    post:
      operationId: createFilter
      parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1PostFilterReq'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilterResp'
          description: Created
      summary: Create a filter; each user may have one filter of each type.
      tags:
      - filters
  /api/users/{userID}/filters/{filterID}:
    delete:
      operationId: deleteFilter
      parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - in: path
        name: filterID
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
      summary: Delete a filter.
      tags:
      - filters
    get:
      operationId: getFilter
      parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - in: path
        name: filterID
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilterResp'
          description: OK
      summary: Get a filter.
      tags:
      - filters
    put:
      operationId: updateFilter
      parameters:
      - in: path
        name: userID
        required: true
        schema:
          type: string
      - in: path
        name: filterID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1PutFilterReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1FilterResp'
          description: OK
      summary: Replace a filter's enabled state and configuration.
      tags:
      - filters
  /api/viewer:
    get:
      operationId: getViewer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Viewer'
          description: OK
      summary: Get info about the current viewer, including their subscriptions.
      tags:
      - viewer
components:
  schemas:
    V1FeedEntryResp:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        feed_id:
          type: string
        id:
          type: string
        reader_content:
          type: string
        title:
          type: string
        url:
          type: string
      type: object
    V1FeedResp:
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: string
        last_synced_at:
          format: date-time
          nullable: true
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        url:
          type: string
      type: object
    V1FilterAIConfig:
      properties:
        prompt:
          type: string
      type: object
    V1FilterListConfig:
      properties:
        allowlist:
          items:
            type: string
          nullable: true
          type: array
        disallowlist:
          items:
            type: string
          nullable: true
          type: array
      type: object
    V1FilterListResp:
      properties:
        filters:
          items:
            $ref: '#/components/schemas/V1FilterResp'
          type: array
      type: object
    V1FilterResp:
      oneOf:
      - additionalProperties: false
        properties:
          ai_config:
            $ref: '#/components/schemas/V1FilterAIConfig'
          created_at:
            format: date-time
            type: string
          enabled:
            type: boolean
          id:
            type: string
          type:
            enum:
            - ai
            type: string
          updated_at:
            format: date-time
            type: string
          user_id:
            type: string
        required:
        - id
        - user_id
        - type
        - enabled
        - ai_config
        - created_at
        - updated_at
        type: object
      - additionalProperties: false
        properties:
          created_at:
            format: date-time
            type: string
          enabled:
            type: boolean
          id:
            type: string
          list_config:
            properties:
              allowlist:
                items:
                  type: string
                type: array
              disallowlist:
                items:
                  type: string
                type: array
            type: object
          type:
            enum:
            - list
            type: string
          updated_at:
            format: date-time
            type: string
          user_id:
            type: string
        required:
        - id
        - user_id
        - type
        - enabled
        - list_config
        - created_at
        - updated_at
        type: object
      type: object
    V1PaginationMeta:
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      type: object
    V1PostFilterReq:
      oneOf:
      - additionalProperties: false
        properties:
          ai_config:
            $ref: '#/components/schemas/V1FilterAIConfig'
          enabled:
            type: boolean
          type:
            enum:
            - ai
            type: string
        required:
        - type
        - enabled
        - ai_config
        type: object
      - additionalProperties: false
        properties:
          enabled:
            type: boolean
          list_config:
            $ref: '#/components/schemas/V1FilterListConfig'
          type:
            enum:
            - list
            type: string
        required:
        - type
        - enabled
        - list_config
        type: object
      type: object
    V1PostSubscriptionReq:
      properties:
        feed_url:
          type: string
      type: object
    V1PutFilterReq:
      oneOf:
      - additionalProperties: false
        properties:
          ai_config:
            $ref: '#/components/schemas/V1FilterAIConfig'
          enabled:
            type: boolean
        required:
        - enabled
        - ai_config
        type: object
      - additionalProperties: false
        properties:
          enabled:
            type: boolean
          list_config:
            $ref: '#/components/schemas/V1FilterListConfig'
        required:
        - enabled
        - list_config
        type: object
      type: object
    V1SubscriptionListResp:
      properties:
        subscriptions:
          items:
            $ref: '#/components/schemas/V1SubscriptionResp'
          nullable: true
          type: array
      type: object
    V1SubscriptionResp:
      properties:
        created_at:
          format: date-time
          type: string
        feed_description:
          type: string
        feed_id:
          type: string
        feed_name:
          type: string
        id:
          type: string
        last_synced:
          format: date-time
          nullable: true
          type: string
      type: object
    V1TimelineEntry:
      properties:
        description:
          type: string
        entry_id:
          type: string
        feed_name:
          type: string
        publish_date:
          format: date-time
          type: string
        title:
          type: string
        url:
          type: string
      type: object
    V1TimelineResp:
      properties:
        items:
          items:
            $ref: '#/components/schemas/V1TimelineEntry'
          nullable: true
          type: array
        pagination:
          $ref: '#/components/schemas/V1PaginationMeta'
      type: object
    V1Viewer:
      properties:
        subscriptions:
          additionalProperties:
            $ref: '#/components/schemas/V1ViewerSubscription'
          nullable: true
          type: object
        user:
          $ref: '#/components/schemas/V1ViewerUser'
      type: object
    V1ViewerSubscription:
      properties:
        description:
          type: string
        feed_id:
          type: string
        name:
          type: string
      type: object
    V1ViewerUser:
      properties:
        id:
          type: string
        preferred_name:
          type: string
      type: object
